<!DOCTYPE html>
<html>
<head>
    <title>Our Memories 💕</title>
    <style>
        body {
            font-family: Arial;
            background-color: #fff4f8;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #ff5a8a;
        }
        .photos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .photos img {
            width: 220px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        a {
            color: #ff5a8a;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    
    <!-- 🎵 Background Music -->
    <audio id="bg-music" src="music.MP3" loop></audio>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const music = document.getElementById("bg-music");

            // Try autoplay after page load
            setTimeout(() => {
                music.play().catch(() => {
                    console.log("Autoplay blocked — will start on first tap.");
                });
            }, 500);

            // If autoplay blocked, first tap will start the music
            document.body.addEventListener("click", () => {
                music.play();
            }, { once: true });
        });
    </script>

    <h1>Our Cute Memories 💗</h1>

    <div class="photos">
        <img src="img1.jpg">
        <img src="img2.jpg">
        <img src="img3.jpg">
        <img src="img4.jpg">
        <img src="img5.jpg">
        <img src="img6.jpg">
        <img src="img7.jpg">
        <img src="img8.jpg">
    </div>

    <a href="index.html">⬅ Back</a>

</body>
</html>
